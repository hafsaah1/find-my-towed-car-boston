name: Refresh tows from Boston

on:
  schedule:
    # Every 6 minutes. GitHub Actions minimum is 5 min, and runs may be
    # delayed under load — in practice this usually fires every 6–15 min.
    - cron: "*/6 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run enrich.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ENRICH_WORKERS: "4"
          ENRICH_BUDGET_SEC: "300"
        run: python enrich.py
